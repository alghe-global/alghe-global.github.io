<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parlamentul României – locuri pe partide</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d2127; --muted:#69707a; --line:#dcdad2; --accent:#1d2127;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#14171b; --panel:#1c2026; --ink:#eceae4; --muted:#9aa1ab; --line:#2f353d; --accent:#eceae4; color-scheme:dark; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
main{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:1.7rem;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
button,select,label.btn{font:inherit;font-size:.95rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 13px;cursor:pointer}
button:hover,label.btn:hover,select:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px}
.tabs button[aria-selected=true]{border-bottom-color:var(--accent);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
#status{color:var(--muted);font-size:.9rem}
#status.err{color:#c0392b}
svg{width:100%;height:auto;display:block}
.seat{transition:opacity .15s}
.dim{opacity:.18}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px}
.legend button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:3px 4px;font-size:.92rem}
.legend button.off{opacity:.35;text-decoration:line-through}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block}
table{border-collapse:collapse;width:100%;margin-top:18px;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted)}
tfoot td{font-weight:600;border-bottom:0}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:5px;font-size:.85rem;opacity:0;transition:opacity .1s;z-index:9;white-space:nowrap}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:6px}
.axis text{fill:var(--muted);font:12px system-ui,sans-serif}
.grid{stroke:var(--line)}
.ctr{fill:var(--ink)}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>Parlamentul României</h1>
  <p class="sub">Locuri pe partide, citite din fișierele <code>data/data_ro_parties_&lt;timestamp&gt;.json</code>.</p>

  <div class="bar">
    <span id="status">Se citesc fișierele din data/ …</span>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-seats" aria-selected="true">Hemiciclu</button>
    <button role="tab" id="t-line" aria-selected="false">Evoluție în timp</button>
  </div>

  <section id="v-seats" class="panel">
    <div class="bar">
      <label for="snap">Situația la:</label>
      <select id="snap"></select>
    </div>
    <div id="seatsOut"></div>
  </section>

  <section id="v-line" class="panel hidden">
    <div id="lineOut"></div>
  </section>
</main>
<div id="tip"></div>

<script>
"use strict";
/* ---------- Culori ---------- */
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const BASE = {
  psd:"#e0223a", pnl:"#f2c200", aur:"#d97a00", usr:"#1aa7ec", udmr:"#2e8b3d",
  "sos ro":"#7b3fa0", upr:"#14b8a6", pace:"#6b7280", minoritati:"#8d6e63", neafiliati:"#9ca3af"
};
// ordinea de la stânga la dreapta în hemiciclu
const ORDER = ["psd","psd afiliat","usr","pace","neafiliati","minoritati","upr","sos ro","pnl","pnl afiliat","udmr","aur","aur afiliat"];

function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}
  return [h,s*100,l*100];
}
const hsl=(h,s,l)=>`hsl(${h.toFixed(0)} ${s.toFixed(0)}% ${l.toFixed(0)}%)`;
function colorFor(name){
  const n = norm(name);
  const isAff = /\s*afiliat$/.test(n);
  const base = n.replace(/\s*afiliat$/,"");
  let hex = BASE[base];
  if(!hex){ // culoare stabilă pentru partide necunoscute
    let h=0; for(const c of base) h=(h*31+c.charCodeAt(0))%360;
    return isAff ? hsl(h,60,70) : hsl(h,60,45);
  }
  if(!isAff) return hex;
  const [h,s,l] = hexToHsl(hex);
  return hsl(h,s,l+(100-l)*0.5);     // aceeași culoare, ton mai deschis
}
const total = v => v.total ?? ((v.deputies||0)+(v.senators||0));
const sortParties = names => [...names].sort((a,b)=>{
  const ia=ORDER.indexOf(norm(a)), ib=ORDER.indexOf(norm(b));
  return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b);
});

/* ---------- Încărcare date ---------- */
let snaps = [];          // [{ts, data}] sortate crescător
const FILE_RE = /(\d{9,13})\.json$/i;
const $ = id => document.getElementById(id);
const status = (t,err=false)=>{ const s=$("status"); s.textContent=t; s.className=err?"err":""; };
const tsToDate = ts => new Date(ts > 1e12 ? ts : ts*1000);
const fmtDate = ts => tsToDate(ts).toLocaleString("ro-RO",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const fmtShort = ts => tsToDate(ts).toLocaleDateString("ro-RO",{day:"2-digit",month:"2-digit"});

function setSnaps(list){
  snaps = list.sort((a,b)=>a.ts-b.ts);
  if(!snaps.length){ status("Nu am găsit fișiere data_ro_parties_<timestamp>.json valide.",true); render(); return; }
  status(`${snaps.length} fișier${snaps.length>1?"e":""} încărcat${snaps.length>1?"e":""}.`);
  const sel=$("snap");
  sel.innerHTML = snaps.map((s,i)=>`<option value="${i}">${fmtDate(s.ts)}</option>`).reverse().join("");
  sel.value = snaps.length-1;      // implicit: cel mai recent fișier
  render();
}
// Citește direct din data/ (doar citire: aplicația nu scrie și nu șterge nimic)
async function autoLoad(){
  try{
    const html = await (await fetch("data/",{cache:"no-store"})).text();
    const names=[...new Set([...html.matchAll(/data_ro_parties_(\d{9,13})\.json/g)].map(m=>m[0]))];
    if(!names.length) throw new Error("listare goală");
    const list=[]; let bad=0;
    await Promise.all(names.map(async n=>{
      try{ list.push({ts:+n.match(FILE_RE)[1], data:await (await fetch("data/"+n,{cache:"no-store"})).json(), name:n}); }
      catch{ bad++; }
    }));
    setSnaps(list);
    if(bad) status($("status").textContent+` ${bad} fișier(e) invalide ignorate.`,true);
  }catch{
    status("Nu pot citi data/. Browserul blochează accesul la fișiere locale din file:// – vezi instrucțiunile de mai jos.",true);
    render();
  }
}

/* ---------- Hemiciclu ---------- */
const tip=$("tip");
function showTip(e,html){ tip.innerHTML=html; tip.style.opacity=1;
  tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8)+"px"; tip.style.top=(e.clientY+14)+"px"; }
const hideTip=()=>tip.style.opacity=0;

function layoutSeats(N){
  const W=900,H=500,cx=450,cy=470,R1=420,R0=150;
  const rows=Math.max(3,Math.round(Math.sqrt(N/2.6)));
  const radii=[...Array(rows)].map((_,i)=>R0+i*(R1-R0)/(rows-1));
  const sumR=radii.reduce((a,b)=>a+b,0);
  const counts=radii.map(r=>Math.max(2,Math.round(N*r/sumR)));
  let diff=N-counts.reduce((a,b)=>a+b,0), k=rows-1;
  while(diff!==0){ const d=diff>0?1:-1; if(counts[k]+d>=2){counts[k]+=d;diff-=d;} k=(k-1+rows)%rows; }
  const gap=(R1-R0)/(rows-1);
  const dot=Math.min(gap,Math.PI*R0/counts[0])*0.42;
  const seats=[];
  radii.forEach((r,i)=>{ const n=counts[i];
    for(let j=0;j<n;j++){ const a=Math.PI-Math.PI*j/(n-1);
      seats.push({a,r,x:cx+r*Math.cos(a),y:cy-r*Math.sin(a)}); } });
  seats.sort((p,q)=>q.a-p.a || p.r-q.r);
  return {W,H,cx,cy,dot,seats};
}

function renderSeats(){
  const out=$("seatsOut");
  const snap=snaps[+$("snap").value]; if(!snap){ out.innerHTML=empty(); return; }
  const parties=sortParties(Object.keys(snap.data)).filter(p=>total(snap.data[p])>0);
  const N=parties.reduce((a,p)=>a+total(snap.data[p]),0);
  const L=layoutSeats(N);
  let idx=0, dots="";
  for(const p of parties){ const t=total(snap.data[p]), c=colorFor(p);
    for(let i=0;i<t;i++,idx++){ const s=L.seats[idx];
      dots+=`<circle class="seat" data-p="${esc(p)}" cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="${L.dot.toFixed(1)}" fill="${c}"/>`; } }
  const center=`<text class="ctr" x="${L.cx}" y="${L.cy-48}" text-anchor="middle" font-size="64" font-weight="600" font-family="Georgia,serif">${N}</text>
    <text class="ctr" x="${L.cx}" y="${L.cy-14}" text-anchor="middle" font-size="18" font-family="Georgia,serif" opacity=".7">parlamentari</text>`;
  const rowsHtml=parties.map(p=>{ const v=snap.data[p],t=total(v);
    return `<tr data-p="${esc(p)}"><td><span class="sw" style="background:${colorFor(p)}"></span> ${esc(p)}</td>
      <td>${v.deputies??"–"}</td><td>${v.senators??"–"}</td><td>${t}</td><td>${(100*t/N).toFixed(1)}%</td></tr>`; }).join("");
  const sd=parties.reduce((a,p)=>a+(snap.data[p].deputies||0),0), ss=parties.reduce((a,p)=>a+(snap.data[p].senators||0),0);
  out.innerHTML=`<svg viewBox="0 0 ${L.W} ${L.H-20}" role="img" aria-label="Hemiciclu cu ${N} locuri">${dots}${center}</svg>
    <table><thead><tr><th>Partid</th><th>Deputați</th><th>Senatori</th><th>Total</th><th>Pondere</th></tr></thead>
    <tbody>${rowsHtml}</tbody><tfoot><tr><td>Total</td><td>${sd}</td><td>${ss}</td><td>${N}</td><td></td></tr></tfoot></table>`;
  const svg=out.querySelector("svg");
  const focus=p=>{ svg.querySelectorAll(".seat").forEach(c=>c.classList.toggle("dim",p!==null&&c.dataset.p!==p)); };
  svg.addEventListener("mousemove",e=>{ const c=e.target.closest(".seat"); if(!c){hideTip();focus(null);return;}
    const p=c.dataset.p; focus(p); showTip(e,`<b>${esc(p)}</b>: ${total(snap.data[p])} locuri`); });
  svg.addEventListener("mouseleave",()=>{hideTip();focus(null);});
  out.querySelectorAll("tbody tr").forEach(tr=>{
    tr.addEventListener("mouseenter",()=>focus(tr.dataset.p)); tr.addEventListener("mouseleave",()=>focus(null)); });
}

/* ---------- Grafic liniar ---------- */
const hidden=new Set();
function niceMax(v){ const p=10**Math.floor(Math.log10(v)), f=v/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }

function renderLine(){
  const out=$("lineOut");
  if(!snaps.length){ out.innerHTML=empty(); return; }
  const parties=sortParties([...new Set(snaps.flatMap(s=>Object.keys(s.data)))]);
  const W=900,H=480,m={l:50,r:20,t:20,b:50};
  const t0=snaps[0].ts,t1=snaps[snaps.length-1].ts;
  const X=ts=>snaps.length===1?(m.l+W-m.r)/2:m.l+(ts-t0)/(t1-t0)*(W-m.l-m.r);
  let mx=1; snaps.forEach(s=>parties.forEach(p=>{ if(s.data[p]&&!hidden.has(p)) mx=Math.max(mx,total(s.data[p])); }));
  const yMax=niceMax(mx*1.05), Y=v=>H-m.b-v/yMax*(H-m.t-m.b);
  let g="";
  for(let i=0;i<=5;i++){ const v=yMax*i/5; g+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text>`; }
  snaps.forEach(s=>{ g+=`<line class="grid" stroke-dasharray="2 4" x1="${X(s.ts)}" x2="${X(s.ts)}" y1="${m.t}" y2="${H-m.b}"/>
    <text x="${X(s.ts)}" y="${H-m.b+20}" text-anchor="middle">${fmtShort(s.ts)}</text>`; });
  let lines="",pts=[];
  for(const p of parties){ if(hidden.has(p)) continue;
    const c=colorFor(p), aff=/afiliat$/.test(norm(p));
    const pp=snaps.filter(s=>s.data[p]).map(s=>({p,ts:s.ts,v:total(s.data[p]),x:X(s.ts),y:Y(total(s.data[p])),c}));
    if(pp.length>1) lines+=`<polyline fill="none" stroke="${c}" stroke-width="2.5" ${aff?'stroke-dasharray="6 4"':""} stroke-linejoin="round" points="${pp.map(q=>q.x.toFixed(1)+","+q.y.toFixed(1)).join(" ")}"/>`;
    pp.forEach(q=>lines+=`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="3.5" fill="${c}"/>`);
    pts.push(...pp); }
  const legend=parties.map(p=>`<button data-p="${esc(p)}" class="${hidden.has(p)?"off":""}" aria-pressed="${!hidden.has(p)}"><span class="sw" style="background:${colorFor(p)}"></span>${esc(p)}</button>`).join("");
  out.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evoluția numărului de parlamentari pe partide"><g class="axis">${g}</g>${lines}<circle id="hl" r="7" fill="none" stroke="var(--ink)" stroke-width="2" opacity="0"/></svg>
    <div class="legend">${legend}</div>
    <p class="sub" style="margin:10px 0 0;font-size:.88rem">Apasă pe un partid din legendă pentru a-l ascunde sau afișa. Liniile punctate sunt categoriile „afiliat”.</p>`;
  const svg=out.querySelector("svg"),hl=out.querySelector("#hl");
  svg.addEventListener("mousemove",e=>{
    const r=svg.getBoundingClientRect(), sx=W/r.width, mxp=(e.clientX-r.left)*sx, myp=(e.clientY-r.top)*sx;
    let best=null,bd=28; for(const q of pts){ const d=Math.hypot(q.x-mxp,q.y-myp); if(d<bd){bd=d;best=q;} }
    if(!best){hideTip();hl.setAttribute("opacity",0);return;}
    hl.setAttribute("cx",best.x);hl.setAttribute("cy",best.y);hl.setAttribute("opacity",1);
    showTip(e,`<b>${esc(best.p)}</b>: ${best.v}<br>${fmtDate(best.ts)}`); });
  svg.addEventListener("mouseleave",()=>{hideTip();hl.setAttribute("opacity",0);});
  out.querySelectorAll(".legend button").forEach(b=>b.addEventListener("click",()=>{
    hidden.has(b.dataset.p)?hidden.delete(b.dataset.p):hidden.add(b.dataset.p); renderLine(); }));
}

/* ---------- Comun ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const empty=()=>`<div class="empty"><strong>Nu am putut citi fișierele din data/</strong>
Browserele nu permit paginilor deschise din <code>file://</code> să citească foldere locale.<br>
Soluții fără instalări: în Chrome/Edge pornește o dată cu <code>--allow-file-access-from-files</code>,
sau pune <code>index.html</code> și <code>data/</code> pe orice server web static care listează directorul <code>data/</code>.</div>`;
function render(){ renderSeats(); renderLine(); }
$("snap").addEventListener("change",renderSeats);
function tab(which){
  $("v-seats").classList.toggle("hidden",which!=="seats"); $("v-line").classList.toggle("hidden",which!=="line");
  $("t-seats").setAttribute("aria-selected",which==="seats"); $("t-line").setAttribute("aria-selected",which==="line"); hideTip();
}
$("t-seats").onclick=()=>tab("seats"); $("t-line").onclick=()=>tab("line");
render(); autoLoad();
</script>
</body>
</html>
